# Publica una versión: al subir la etiqueta v<versión> (la misma de app/build.gradle.kts), compila el APK
# sin clave de Drive y lo deja en Releases. La app lo busca ahí para actualizarse.
name: Publicar versión

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: La etiqueta coincide con la versión de la app
        run: |
          VERSION=$(sed -n 's/^val versionApp = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta es $GITHUB_REF_NAME pero la app dice $VERSION"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Compilar y correr las pruebas
        run: bash ./gradlew assembleRelease testDebugUnitTest --console=plain
      - name: El APK no trae ninguna clave de Drive
        run: |
          if unzip -p app/build/outputs/apk/release/app-release.apk | grep -a -q 'AIza'; then
            echo "El APK trae una clave de Drive adentro"; exit 1
          fi
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "museum-slideshow-$VERSION.apk"
          gh release create "$GITHUB_REF_NAME" "museum-slideshow-$VERSION.apk" \
            --title "Museum Slideshow $VERSION" --generate-notes
